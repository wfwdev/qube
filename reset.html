<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff5f00">
    <title>Qube – alaphelyzet</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: -apple-system, system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
        .card { max-width: 340px; margin: 16px; padding: 28px 22px; text-align: center; background: #fff;
                border: 1px solid #e2e8f0; border-radius: 20px; }
        .ico { font-size: 2.4rem; }
        p { color: #64748b; font-size: .9rem; line-height: 1.4; }
        .spin { width: 32px; height: 32px; margin: 16px auto 0; border: 4px solid #e2e8f0; border-top-color: #9d29b2;
                border-radius: 50%; animation: s .8s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="ico">🧹</div>
        <h3>Alaphelyzetbe állítás</h3>
        <p id="msg">Régi verzió és gyorsítótár törlése…<br>A bejelentkezésed és a még fel nem töltött generálások megmaradnak.</p>
        <div class="spin"></div>
    </div>
    <script>
    // Önálló oldal: semmit nem tölt be az appból, így akkor is működik, ha az app hibás.
    // Nem törli: Firebase azonosítás (IndexedDB), IC kimenő sor, utolsó generálás.
    (async () => {
        try {
            const regs = (await navigator.serviceWorker?.getRegistrations?.()) || [];
            await Promise.all(regs.map((r) => r.unregister()));
        } catch (e) { /* nincs SW */ }
        try {
            const keys = (await caches?.keys?.()) || [];
            await Promise.all(keys.map((k) => caches.delete(k)));
        } catch (e) { /* nincs cache */ }
        try { localStorage.removeItem('qube_session'); } catch (e) { /* tiltott tárhely */ }
        setTimeout(() => location.replace('./index.html?t=' + Date.now()), 900);
    })();
    </script>
</body>
</html>
