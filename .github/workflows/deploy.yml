# ============================================================
# Qube kiadás: ellenőrzés → verziószám → GitHub Pages
# Minden feltöltés (push a main ágra) után lefut. Ha az ellenőrzés hibát
# talál, NEM kerül ki semmi – élesben a korábbi, működő verzió marad.
# Beállítás (egyszer): Settings → Pages → Source: "GitHub Actions"
# ============================================================
name: Kiadás

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ellenőrzés
        run: node tools/check.mjs

      - name: Verziószám beírása
        run: |
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/^const VERSION = .*/const VERSION = 'qube-${BUILD}';/" sw.js
          sed -i "s/build: 'dev'/build: '${BUILD}'/" js/config.js
          grep -q "qube-${BUILD}" sw.js
          grep -q "build: '${BUILD}'" js/config.js
          echo "Kiadott verzió: ${BUILD}"

      - name: Csomag összeállítása
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' --exclude '_site' --exclude 'README.md' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

