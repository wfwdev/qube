<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MES terminál · Qube</title>
    <meta name="theme-color" content="#ff5f00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body data-page="mes" data-title="MES terminál" data-perm="mes.use">
    <script>if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme: dark)').matches)) document.body.classList.add('dark-mode');</script>

    <main class="container app-main">
        <!-- MENTETT FIÓK -->
        <section id="viewCard" class="hidden">
            <div class="minimal-card text-center">
                <div class="mes-ico">💳</div>
                <div class="text-muted tiny">Mentett MES fiók</div>
                <div class="fw-bold fs-5 mb-4 mono" id="cardUser"></div>
                <button class="btn btn-primary btn-lg w-100" id="showQrBtn">Belépő QR megjelenítése</button>
                <button class="btn btn-light w-100 mt-2" id="editBtn">Adatok módosítása</button>
            </div>
        </section>

        <!-- ŰRLAP -->
        <section id="viewForm" class="hidden">
            <div class="minimal-card">
                <h5 class="fw-bold mb-1">MES belépési adatok</h5>
                <p class="text-muted small mb-4">Csak ezen a telefonon tárolódik, a szerverre nem kerül fel.</p>
                <label class="form-label" for="mesUser">MES felhasználónév</label>
                <input type="text" id="mesUser" class="form-control form-control-lg mb-3" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Pl. kovacs.gabor">
                <label class="form-label" for="mesPass">MES jelszó</label>
                <div class="pass-wrap mb-4">
                    <input type="password" id="mesPass" class="form-control form-control-lg" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="••••••••">
                    <button type="button" class="pass-eye" id="passEye" aria-label="Jelszó mutatása">👁️</button>
                </div>
                <button class="btn btn-primary btn-lg w-100" id="saveBtn">Mentés</button>
                <div class="d-flex gap-2 mt-2">
                    <button class="btn btn-light flex-grow-1 hidden" id="cancelBtn">Mégsem</button>
                    <button class="btn btn-outline-danger flex-grow-1 hidden" id="deleteBtn">Adatok törlése</button>
                </div>
            </div>
        </section>

        <!-- BEÁLLÍTÁS -->
        <div class="minimal-card">
            <label class="form-label" for="qrSuffix">Jelszó után a QR ezt „nyomja meg”</label>
            <select id="qrSuffix" class="form-select mb-1">
                <option value="f4">F4 (Honeywell olvasó)</option>
                <option value="none">Semmit – az F4-et kézzel nyomom</option>
                <option value="tab-enter">TAB → ENTER</option>
                <option value="tab-space">TAB → SZÓKÖZ</option>
                <option value="tab2-enter">TAB → TAB → ENTER</option>
                <option value="enter">ENTER</option>
            </select>
            <div class="text-muted tiny mb-2">Ha az F4 nem lép be, válaszd a „Semmit”, és nyomd meg kézzel. Hibakereséshez: <a href="olvaso-teszt.html">olvasó teszt</a>.</div>
            <button class="btn btn-light btn-sm w-100 mb-3" id="testF4Btn">Teszt-QR: csak F4</button>
            <label class="form-label" for="qrTimeout">A QR ennyi idő után eltűnik</label>
            <select id="qrTimeout" class="form-select">
                <option value="15">15 másodperc</option>
                <option value="30">30 másodperc</option>
                <option value="60">1 perc</option>
                <option value="120">2 perc</option>
                <option value="0">Csak ha bezárom</option>
            </select>
        </div>
    </main>

    <!-- Teljes képernyős QR -->
    <div class="qr-fullscreen hidden" id="qrFullscreen">
        <div class="qr-scroll-area">
            <div class="qr-meta">Csippantsd le a terminálnál!</div>
            <div class="qr-large-box"><div id="mesQr"></div><div class="qr-label" id="mesQrUser"></div></div>
            <div class="countdown hidden" id="countdown"><div class="countdown-bar" id="countdownBar"></div></div>
            <div class="text-muted small" id="countdownText"></div>
        </div>
        <div class="qr-footer"><button class="btn btn-primary btn-lg w-100" id="qrClose">Bezárás</button></div>
    </div>

    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/mes.js"></script>
</body>
</html>
