<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Csomagoló kód · Qube</title>
    <meta name="theme-color" content="#ff5f00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body data-page="pack" data-title="Csomagoló kód" data-perm="pack.use">
    <script>if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme: dark)').matches)) document.body.classList.add('dark-mode');</script>

    <main class="container app-main">
        <!-- MENTETT KÓD -->
        <section id="viewCard" class="hidden">
            <div class="minimal-card text-center">
                <div class="mes-ico">📦</div>
                <div class="text-muted tiny">Mentett csomagoló kód</div>
                <div class="fw-bold fs-4 mb-4 mono" id="cardCode"></div>
                <button class="btn btn-primary btn-lg w-100" id="showQrBtn">QR megjelenítése</button>
                <button class="btn btn-light w-100 mt-2" id="editBtn">Kód módosítása</button>
            </div>
        </section>

        <!-- ŰRLAP -->
        <section id="viewForm" class="hidden">
            <div class="minimal-card">
                <h5 class="fw-bold mb-1">Csomagoló kód</h5>
                <p class="text-muted small mb-4">Csak ezen a telefonon tárolódik, a szerverre nem kerül fel.</p>
                <label class="form-label" for="packCode">Kód (csak számjegyek)</label>
                <input type="text" id="packCode" class="form-control form-control-lg mono mb-4" inputmode="numeric" pattern="[0-9]*" maxlength="30" autocomplete="off" placeholder="Pl. 123456">
                <button class="btn btn-primary btn-lg w-100" id="saveBtn">Mentés</button>
                <div class="d-flex gap-2 mt-2">
                    <button class="btn btn-light flex-grow-1 hidden" id="cancelBtn">Mégsem</button>
                    <button class="btn btn-outline-danger flex-grow-1 hidden" id="deleteBtn">Kód törlése</button>
                </div>
            </div>
        </section>

        <!-- BEÁLLÍTÁS -->
        <div class="minimal-card">
            <label class="form-label" for="qrTimeout">A QR ennyi idő után eltűnik</label>
            <select id="qrTimeout" class="form-select">
                <option value="15">15 másodperc</option>
                <option value="30">30 másodperc</option>
                <option value="60">1 perc</option>
                <option value="120">2 perc</option>
                <option value="0">Csak ha bezárom</option>
            </select>
        </div>
    </main>

    <!-- Teljes képernyős QR -->
    <div class="qr-fullscreen hidden" id="qrFullscreen">
        <div class="qr-scroll-area">
            <div class="qr-meta">Csippantsd le!</div>
            <div class="qr-large-box"><div id="packQr"></div><div class="qr-label" id="packQrText"></div></div>
            <div class="countdown hidden" id="countdown"><div class="countdown-bar" id="countdownBar"></div></div>
            <div class="text-muted small" id="countdownText"></div>
        </div>
        <div class="qr-footer"><button class="btn btn-primary btn-lg w-100" id="qrClose">Bezárás</button></div>
    </div>

    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/pack.js"></script>
</body>
</html>
