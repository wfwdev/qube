<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Visszajelzés · Qube</title>
    <meta name="theme-color" content="#ff5f00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="feedback" data-title="Visszajelzés">
    <script>if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme: dark)').matches)) document.body.classList.add('dark-mode');</script>

    <main class="container app-main">
        <!-- ÚJ BEKÜLDÉS -->
        <section id="tab-new">
            <div class="minimal-card">
                <h5 class="fw-bold mb-1">Hiba vagy ötlet</h5>
                <p class="text-muted small mb-3">Közvetlenül a Qube fejlesztőjéhez jut el. Minden üzenetet elolvasok, és a <b>Sajátjaim</b> fülön látod, hol tart.</p>

                <div class="pill-nav" id="fbType">
                    <button data-type="bug" class="active">🐞 Hiba</button>
                    <button data-type="idea">💡 Ötlet</button>
                </div>

                <label class="form-label" for="fbModule">Melyik részhez?</label>
                <select id="fbModule" class="form-select mb-3"></select>

                <label class="form-label" for="fbText" id="fbTextLabel">Mi történt?</label>
                <textarea id="fbText" class="form-control mb-1" rows="6" maxlength="2000"></textarea>
                <div class="text-muted tiny mb-3"><span id="fbCount">0</span>/2000 · A verziót és a telefon típusát automatikusan csatolom.</div>

                <button class="btn btn-primary btn-lg w-100" id="fbSend">Küldés</button>
                <div class="sync-line hidden mt-3" id="fbPending"></div>
            </div>
        </section>

        <!-- SAJÁT BEJELENTÉSEK -->
        <section id="tab-mine" class="hidden">
            <div id="mineList"><div class="text-center text-muted small py-4">Betöltés…</div></div>
        </section>

        <!-- BEÉRKEZETT (admin) -->
        <section id="tab-all" class="hidden">
            <div class="chip-row mb-3" id="allFilters"></div>
            <div id="allList"><div class="text-center text-muted small py-4">Betöltés…</div></div>
        </section>
    </main>

    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/feedback.js"></script>
</body>
</html>
